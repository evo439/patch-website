media:
  input: public/images
  output: /images

content:
  - name: shows
    label: "Shows & Concerts"
    type: collection
    path: src/content/shows
    filename: "{fields.datum}-{fields.locatie}"
    extension: json
    format: json
    fields:
      - { name: "datum", label: "Date (YYYY-MM-DD)", type: "date" }
      - { name: "locatie", label: "Venue / Festival Name", type: "string" }
      - { name: "stad", label: "City & Country", type: "string" }
      - { name: "ticketUrl", label: "Ticket or Info Link", type: "string" }

  - name: pages
    label: "Pages & Content"
    type: collection
    path: src/content/pages
    extension: json
    format: json
    fields:
      - { name: "title", label: "Page Title", type: "string" }
      - { name: "subtitle", label: "Page Subtitle / Tagline", type: "string" }
      - { name: "description", label: "Meta Description (SEO)", type: "string" }
      - { name: "content", label: "Body Content (Rich Text for Custom Pages)", type: "rich-text" }
      - { name: "heroTagline", label: "Hero Banner Tagline (Home Page only)", type: "string" }
      - { name: "spotifyEmbedUrl", label: "Spotify Embed URL (Music Page only)", type: "string" }
      - { name: "youtubeVideoUrl", label: "YouTube Video URL (Music Page only)", type: "string" }
      - { name: "showInNav", label: "Show in Header Navbar?", type: "boolean", default: true }
      - { name: "navOrder", label: "Navbar Order Position (e.g. 10)", type: "number", default: 10 }

  - name: settings
    label: "Band Settings & Contact Info"
    type: file
    path: src/content/settings/band.json
    fields:
      - { name: "bio", label: "Band Biography", type: "rich-text" }
      - { name: "contactEmail", label: "Contact E-mail", type: "string" }
      - { name: "contactPhone", label: "Contact Phone / Booking Number", type: "string" }
      - { name: "facebookUrl", label: "Facebook Page URL", type: "string" }
      - { name: "instagramUrl", label: "Instagram Profile URL", type: "string" }
      - { name: "youtubeUrl", label: "YouTube Channel URL", type: "string" }
      - { name: "tiktokUrl", label: "TikTok Profile URL", type: "string" }
      - { name: "spotifyUrl", label: "Spotify Artist URL", type: "string" }
